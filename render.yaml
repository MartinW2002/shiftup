# Render Blueprint: https://render.com/docs/blueprint-spec
# The database is hosted on Neon; paste its connection string into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: shiftup
    runtime: ruby
    plan: free
    region: singapore
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: WEB_CONCURRENCY
        value: 0
      - key: RAILS_MAX_THREADS
        value: 3
