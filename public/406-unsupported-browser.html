<!doctype html>
<html lang="en">
  <head>
    <title>Browser not supported · ShiftUp</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <!-- Static page served by Rails without the asset pipeline, so its styles are inline.
         They follow app/assets/stylesheets/application.css. -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #f6f7f9;
        color: #1a1f27;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .demo-banner { background: #fff4d6; color: #7a5300; text-align: center; font-size: 0.8rem; padding: 6px 16px; }
      main { flex: 1; display: grid; place-items: center; padding: 32px 16px; }
      .card {
        width: min(100%, 460px);
        padding: 28px;
        background: #fff;
        border: 1px solid #e3e6ea;
        border-radius: 12px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
      }
      .brand { display: inline-flex; align-items: center; gap: 8px; color: #1a1f27; font-weight: 700; font-size: 1.15rem; text-decoration: none; }
      .brand svg { width: 26px; height: 26px; }
      .code { margin: 24px 0 2px; color: #5d6773; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.02em; }
      h1 { margin: 0 0 16px; font-size: 1.6rem; line-height: 1.25; letter-spacing: -0.01em; }
      .message {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 20px;
        padding: 12px 14px;
        border: 1px solid #f1caca;
        border-radius: 8px;
        background: #fdecec;
        color: #9b1c1c;
        font-size: 0.92rem;
      }
      .message p { margin: 0; }
      .message-icon {
        flex: none;
        width: 20px;
        height: 20px;
        margin-top: 1px;
        border-radius: 999px;
        background: #c42b2b;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 20px;
        text-align: center;
      }
      .button {
        display: inline-block;
        padding: 9px 16px;
        border-radius: 8px;
        background: #1f6feb;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
      }
      .button:hover { background: #1858c4; }
      .button:focus-visible, .brand:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.3); border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="demo-banner" role="note">
      Course demonstration project for CSCI3100. Not an official CUHK service. All data is fictional.
    </div>
    <main>
      <div class="card">
        <a class="brand" href="/">
          <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1f6feb"/><path d="M344 178C320 150 290 140 256 140C206 140 172 168 172 200C172 236 204 248 256 256C308 264 340 278 340 314C340 348 306 372 256 372C218 372 188 360 168 334" fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ShiftUp
        </a>
        <p class="code">406 Not Acceptable</p>
        <h1>Browser not supported</h1>
        <div class="message" role="alert">
          <span class="message-icon" aria-hidden="true">!</span>
          <p>Your browser is not supported. Please update your browser, or use a recent version of Chrome, Firefox, Safari or Edge.</p>
        </div>
        <a class="button" href="/">Back to the home page</a>
      </div>
    </main>
  </body>
</html>
